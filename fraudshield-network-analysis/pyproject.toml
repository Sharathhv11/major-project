[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fraudshield-gcn"
version = "0.1.0"
description = "Transaction Network Fraud Detection Using Graph Convolutional Networks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.12"
authors = [
    {name = "FraudShield Team"},
]

dependencies = [
    "torch>=2.1.0,<2.5",
    "torch-geometric>=2.4.0,<2.6",
    "pandas>=2.0,<2.3",
    "numpy>=1.24,<2.0",
    "scikit-learn>=1.3,<1.5",
    "networkx>=3.1,<3.4",
    "matplotlib>=3.7,<3.10",
    "pyyaml>=6.0,<6.1",
    "joblib>=1.3,<1.5",
    "imbalanced-learn>=0.11,<0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.1",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
